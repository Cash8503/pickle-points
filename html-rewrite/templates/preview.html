<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pickle Points — Preview</title>
        <style>
            @page {
                size: letter portrait;
                margin: 0;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Arial,
                    sans-serif;
                background: #888;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20pt 0 40pt;
                min-height: 100vh;
                overflow-x: hidden;
            }
            .page {
                box-shadow: 0 4pt 20pt rgba(0, 0, 0, 0.4);
                margin-bottom: 0;
            }
            .page-screen-gap {
                height: 20pt;
                flex: 0 0 auto;
            }

            /* Wrapper that collapses to the scaled visual size */
            #scaler-wrap {
                flex-shrink: 0;
                overflow: hidden; /* hides the layout overflow of the un-transformed box */
                transform-style: flat;
            }
            /* Print bar */
            #printbar {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                background: #1a1a1a;
                color: #fff;
                padding: 8px 20px;
                display: flex;
                align-items: center;
                gap: 14px;
                z-index: 100;
                font-family: sans-serif;
                font-size: 13px;
            }
            #printbar button {
                padding: 6px 18px;
                background: #ffc72c;
                color: #1a1a1a;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-weight: 700;
                font-size: 13px;
            }
            #printbar .note {
                font-size: 11px;
                color: #aaa;
            }
            @media print {
                :root {
                    --print-safe-offset: 18pt;
                    --print-safe-scale: 0.93;
                }
                #printbar,
                #printbar-spacer,
                .page-screen-gap {
                    display: none !important;
                }
                /* reset transform for print */
                #scaler-wrap {
                    width: auto !important;
                    height: auto !important;
                    overflow: visible !important;
                }
                #page-scaler {
                    transform: none !important;
                }
                html,
                body {
                    background: white !important;
                    padding: 0 !important;
                    margin: 0 !important;
                    display: block !important;
                }
                .page {
                    box-shadow: none !important;
                    page-break-after: always;
                    break-after: page;
                    margin: 0 !important;
                    padding: 0 !important;
                    transform: translate(
                            var(--print-safe-offset),
                            var(--print-safe-offset)
                        )
                        scale(var(--print-safe-scale));
                    transform-origin: top left;
                }
                .page:last-child {
                    page-break-after: avoid;
                    break-after: avoid;
                }
                .reward-card {
                    box-shadow: none !important;
                }
                .earn-filler-image {
                    opacity: 1 !important;
                }
                .print-on-dark {
                    color: rgba(255, 255, 255, 0.94) !important;
                }
                .print-on-dark-secondary {
                    color: rgba(255, 255, 255, 0.82) !important;
                }
                * {
                    -webkit-print-color-adjust: exact !important;
                    print-color-adjust: exact !important;
                    color-adjust: exact !important;
                }
            }
            [contenteditable]:hover {
                outline: 1px dashed rgba(0, 120, 255, 0.4);
                cursor: text;
            }
            [contenteditable]:focus {
                outline: 2px solid rgba(0, 120, 255, 0.6);
                background: rgba(0, 120, 255, 0.04);
            }
            @media (max-width: 500px) {
                #printbar {
                    flex-wrap: wrap;
                    gap: 8px;
                    padding: 8px 12px;
                }
                #printbar .note {
                    display: none;
                }
                #printbar button {
                    padding: 8px 14px;
                    font-size: 12px;
                }
            }
        </style>
    </head>
    <body>
        <div id="printbar">
            <button onclick="printFromTop()">Print / Save PDF</button>
            <span class="note"
                >Click any text on the chart to edit it before printing.</span
            >
            <span style="flex: 1"></span>
            <span style="color: #aaa; font-size: 11px"
                >{{ total }} page{% if total != 1 %}s{% endif %}</span
            >
        </div>

        <div id="printbar-spacer" style="height: 44pt"></div>

        <div id="scaler-wrap">
            <div id="page-scaler">{{ pages_html|safe }}</div>
        </div>

        <script>
            // ── Scale-to-fit using transform (renders at full res, then scales visually) ──
            (function () {
                var PAGE_W = 816; // 612pt × (96px / 72pt/inch)
                var scaler = document.getElementById("page-scaler");
                var wrap = document.getElementById("scaler-wrap");

                function applyScale() {
                    if (!scaler || !wrap) return;
                    var avail = window.innerWidth;
                    var scale = Math.min(1, avail / PAGE_W);

                    if (scale < 1) {
                        scaler.style.transformOrigin = "0 0";
                        scaler.style.transform = "scale(" + scale + ")";
                        // Collapse the wrapper to the scaled visual dimensions
                        wrap.style.width = Math.ceil(PAGE_W * scale) + "px";
                        wrap.style.height =
                            Math.ceil(scaler.scrollHeight * scale) + "px";
                    } else {
                        scaler.style.transform = "";
                        wrap.style.width = "";
                        wrap.style.height = "";
                    }
                }

                window.addEventListener("resize", applyScale);
                applyScale();

                window._scaleApply = applyScale;
                window._scaleReset = function () {
                    if (scaler) scaler.style.transform = "";
                    if (wrap) {
                        wrap.style.width = "";
                        wrap.style.height = "";
                    }
                };
            })();

            // ── Print helpers ─────────────────────────────────────────────
            let previewPrintScroll = null;

            function preparePrintScroll() {
                if (!previewPrintScroll) {
                    previewPrintScroll = {
                        x: window.scrollX || 0,
                        y: window.scrollY || 0,
                    };
                }
                window._scaleReset && window._scaleReset();
                window.scrollTo(0, 0);
            }

            function restorePrintScroll() {
                if (!previewPrintScroll) return;
                window.scrollTo(previewPrintScroll.x, previewPrintScroll.y);
                previewPrintScroll = null;
                window._scaleApply && window._scaleApply();
            }

            function printFromTop() {
                preparePrintScroll();
                requestAnimationFrame(() => {
                    window.print();
                });
            }

            window.addEventListener("beforeprint", preparePrintScroll);
            window.addEventListener("afterprint", restorePrintScroll);
        </script>
    </body>
</html>
